name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lunch
          POSTGRES_PASSWORD: lunch
          POSTGRES_DB: lunch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LUNCH_DATABASE_URL: postgresql+asyncpg://lunch:lunch@localhost:5432/lunch
      LUNCH_TEST_DATABASE_URL: postgresql+asyncpg://lunch:lunch@localhost:5432/lunch_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      # Every migration must apply, roll back cleanly, and leave no drift from the models.
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Backend coverage'
            echo '```'
            coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
