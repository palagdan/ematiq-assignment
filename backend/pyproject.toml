[project]
name = "lunch"
version = "0.1.0"
description = "Play a game for who pays the lunch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "authlib>=1.3",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx-ws>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["authlib.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["lunch"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# CI fails if coverage drops below this (currently ~98% with branch coverage).
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
